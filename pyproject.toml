[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-cost"
version = "0.1.0"
description = "Token usage and estimated API cost per local OpenAI Codex session"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Bill Murdock", email = "bill@murdocks.org" }]
requires-python = ">=3.9"
keywords = ["codex", "openai", "tokens", "cost", "cli"]
classifiers = [
  "Environment :: Console",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/jwm4/codex-cost"

[project.scripts]
codex-cost = "codex_cost:main"

[tool.setuptools]
package-dir = { "" = "src" }
py-modules = ["codex_cost"]
